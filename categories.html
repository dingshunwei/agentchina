<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Categories | Agent China</title>
<meta name="description" content="Browse all product categories — industrial components, semiconductor materials, AI &amp; data-centre hardware, PCB, liquid cooling, diapers and more. Sourced and quality-checked in China.">
<link rel="canonical" href="https://www.agentchina.uk/categories.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Product Categories | Agent China">
<meta property="og:description" content="All product categories, one page — tap a category to browse products.">
<meta property="og:url" content="https://www.agentchina.uk/categories.html">
<meta property="og:image" content="https://www.agentchina.uk/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#fbf7ef;--card:#fffdfa;--ink:#5b4636;--ink-soft:#8a7466;--line:#eadfcd;--accent:#c8734a;--accent2:#3f7d6a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#fffdf8,#fbf7ef 60%);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .brand{font-size:20px;font-weight:900}
header.top .brand span{color:var(--accent)}
header.top .sp{flex:1}
select.langsel{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:600 13px inherit}
h1{font-size:26px;margin:16px 0 4px}
.sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;max-width:460px;margin-bottom:18px}
.search input{border:0;outline:0;background:none;font:600 14px inherit;color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;transition:.2s;cursor:pointer}
.cat:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 22px 40px -32px rgba(60,40,20,.8)}
.cat .ic{font-size:34px;line-height:1}
.cat .en{font-weight:800;font-size:15.5px}
.cat .zh{font-size:12.5px;color:var(--ink-soft)}
.cat .n{margin-top:6px;font-size:12px;font-weight:700;color:var(--accent2)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
.head h1{margin:0}
.allbtn{display:inline-block;padding:10px 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:13.5px;white-space:nowrap}
.allbtn:hover{filter:brightness(1.06)}
.empty{display:none;color:var(--ink-soft);padding:26px 0;text-align:center}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">🐰 Agent <span>China</span></a>
    <div class="sp"></div>
    <select id="langSel" class="langsel">
      <option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option>
      <option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option>
      <option value="pt">Português</option><option value="ru">Русский</option><option value="ar">العربية</option>
      <option value="ja">日本語</option><option value="ko">한국어</option><option value="hi">हिन्दी</option>
      <option value="nl">Nederlands</option><option value="pl">Polski</option><option value="tr">Türkçe</option>
      <option value="vi">Tiếng Việt</option><option value="th">ไทย</option><option value="id">Bahasa Indonesia</option>
      <option value="sv">Svenska</option><option value="uk">Українська</option>
    </select>
  </header>

  <div class="head">
    <h1 id="hTitle">Product Categories</h1>
    <a class="allbtn" id="allBtn" href="catalog.html">All products →</a>
  </div>
  <div class="sub" id="hSub">Tap a category to browse products — new categories appear automatically.</div>
  <label class="search">🔍<input id="q" type="search" placeholder="Search categories / 搜索分类"></label>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Categories are being updated.</div>

  <footer>
    <span>© 2026 Agent China</span>
    <a href="/">Home</a>
    <a href="catalog.html">Catalog</a>
    <a href="privacy.html">Privacy</a>
  </footer>
</div>

<script>
(function(){
  var API='https://api.agentchina.uk';
  var cats=[],counts={},lang='en',kw='';
  var UI={
    en:{title:'Product Categories',sub:'Tap a category to browse products — new categories appear automatically.',
        search:'Search categories',all:'All products →',empty:'Categories are being updated.',items:'products'},
    zh:{title:'产品分类',sub:'点击分类查看产品 —— 新增品类自动出现。',
        search:'搜索分类',all:'查看全部产品 →',empty:'品类更新中。',items:'个产品'}
  };
  function t(k){var d=UI[lang]||UI.en;return d[k]||UI.en[k];}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function render(){
    var html='',n=0;
    cats.forEach(function(c){
      var en=c.name_en||c.id, zh=c.name_zh||'';
      if(kw){var hay=(en+' '+zh+' '+c.id).toLowerCase();if(hay.indexOf(kw)<0)return;}
      n++;
      var cnt=counts[c.id]||0;
      html+='<a class="cat" href="catalog.html?cat='+encodeURIComponent(c.id)+'">'
        +'<div class="ic">'+esc(c.icon||'📦')+'</div>'
        +'<div class="en">'+esc(en)+'</div>'
        +(zh?('<div class="zh">'+esc(zh)+'</div>'):'')
        +'<div class="n">'+cnt+' '+esc(t('items'))+' →</div></a>';
    });
    document.getElementById('grid').innerHTML=html;
    document.getElementById('empty').style.display=n?'none':'block';
  }
  function labels(){
    document.getElementById('hTitle').textContent=t('title');
    document.getElementById('hSub').textContent=t('sub');
    document.getElementById('q').setAttribute('placeholder',t('search'));
    document.getElementById('allBtn').textContent=t('all');
    document.getElementById('empty').textContent=t('empty');
  }
  document.getElementById('q').addEventListener('input',function(e){kw=(e.target.value||'').trim().toLowerCase();render();});
  document.getElementById('langSel').addEventListener('change',function(e){
    lang=e.target.value;document.documentElement.lang=lang;
    document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
    labels();render();
  });
  lang=document.documentElement.lang||'en';
  if(['en','zh'].indexOf(lang)<0) lang='en';
  document.getElementById('langSel').value=lang;labels();
  Promise.all([
    fetch(API+'/categories').then(function(r){return r.json();}).catch(function(){return [];}),
    fetch(API+'/search').then(function(r){return r.json();}).catch(function(){return [];})
  ]).then(function(res){
    cats=Array.isArray(res[0])?res[0]:[];
    var ps=Array.isArray(res[1])?res[1]:[];
    ps.forEach(function(p){var k=p.category_id||'';counts[k]=(counts[k]||0)+1;});
    render();
  }).catch(function(){document.getElementById('empty').style.display='block';});
})();
</script>

</body>
</html>
