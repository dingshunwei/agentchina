<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;600;700&display=swap');

  :root{
    --cream:#fff6ec;
    --coral:#ff8b7a;
    --red:#e8503a;
    --ink:#5b4636;
    --ink-soft:#8a7466;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Baloo 2','Fredoka',sans-serif;
    color:var(--ink);
    overflow:hidden; /* 禁止滚动 */
    background:
      radial-gradient(circle at 15% 15%, #ffd9c4 0%, transparent 40%),
      radial-gradient(circle at 85% 18%, #c8e9fb 0%, transparent 42%),
      radial-gradient(circle at 50% 95%, #cdeed6 0%, transparent 50%),
      var(--cream);
  }

  /* 真正的蓬松云 */
  .cloud{
    position:fixed;z-index:0;opacity:.85;animation:floatCloud linear infinite;
  }
  .cloud::before,.cloud::after{
    content:'';position:absolute;background:#fff;border-radius:50%;
  }
  .cloud{
    width:150px;height:52px;border-radius:999px;background:#fff;
  }
  .cloud::before{width:80px;height:56px;top:-26px;left:22px;}
  .cloud::after{width:60px;height:44px;top:-18px;right:26px;}
  @keyframes floatCloud{0%{transform:translateX(-14px)}50%{transform:translateX(14px)}100%{transform:translateX(-14px)}}

  .stage{
    height:100%;display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:clamp(10px,3vw,40px);padding:16px;position:relative;z-index:1;
  }
  .side{flex:0 0 auto;max-width:200px;text-align:center;color:#5b4636;}
  .side-left{text-align:right;}
  .side-left h1{font-size:clamp(20px,2.6vw,34px);}
  .side-left .eyebrow{font-size:11px;}
  .side-right{font-size:clamp(16px,2vw,22px);font-weight:700;color:#e8503a;}
  .side-right .hand{font-size:26px;}
  .side-sub{display:block;font-size:12px;color:#8a7466;margin-top:6px;font-weight:400;}

  /* 标题 - 紧凑 */
  header{text-align:center;margin-bottom:14px;}
  .eyebrow{
    display:inline-block;background:var(--coral);color:#fff;padding:6px 18px;
    border-radius:999px;font-weight:700;font-size:13px;letter-spacing:1px;
    box-shadow:0 3px 0 rgba(0,0,0,.07);margin-bottom:10px;
  }
  h1{font-size:clamp(26px,4.5vw,44px);font-weight:800;line-height:1.15;}
  h1 .t{display:inline-block;animation:hop 1.6s ease-in-out infinite;}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}

  /* 环形 */
  .orbit{position:relative;width:min(560px,88vw);aspect-ratio:1/1;}

  .hint{position:absolute;text-align:center;font-size:14px;font-weight:700;color:#a0432a;z-index:6;white-space:nowrap;}
  .center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:30%;aspect-ratio:1/1;border-radius:50%;
    background:linear-gradient(160deg,#fff,#ffe0cf);
    border:5px solid var(--coral);
    box-shadow:0 16px 44px rgba(200,90,40,.22);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:5;
  }
  .center .emoji{font-size:clamp(44px,8vw,72px);line-height:1;animation:breath 2.4s ease-in-out infinite;}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .center .name{font-weight:800;color:var(--red);font-size:clamp(14px,2.2vw,19px);margin-top:3px;}
  .center .tag{
    background:var(--red);color:#fff;font-size:10px;font-weight:800;
    padding:4px 12px;border-radius:999px;margin-top:6px;
  }

  .animal{
    position:absolute;width:16%;aspect-ratio:1/1;border-radius:50%;
    background:rgba(255,255,255,.94);
    box-shadow:0 10px 26px rgba(120,80,40,.14);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;border:3px solid #fff;z-index:2;
    opacity:0;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  @keyframes pop{to{opacity:1}}
  .animal:hover{transform:scale(1.12) rotate(-4deg);z-index:6;}
  .animal .emoji{font-size:clamp(26px,5vw,42px);}
  .animal .nm{font-weight:800;font-size:clamp(10px,1.6vw,12px);margin-top:1px;}

  footer{position:absolute;bottom:18px;text-align:center;color:var(--ink-soft);font-size:14px;width:100%;}
  .hand{font-size:22px;display:inline-block;animation:wig 2s ease-in-out infinite;}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-8deg)}}

  /* 运输元素：轮船(出口) + 飞机(进口) */
  .transport{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .ship{position:absolute;top:0;left:0;font-size:clamp(46px,6.4vw,68px);
    transform:rotate(0deg);
    animation:sail 5s ease-in-out infinite;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.18));z-index:6;
  }
  .ship .label{font-size:11px;font-weight:800;color:#2b6cb0;background:#fff;
    padding:2px 7px;border-radius:6px;position:absolute;bottom:-26px;right:-6px;white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.12);}
  @keyframes sail{
    0%{transform:translate(0,0);opacity:.8}
    50%{transform:translate(12px,6px);opacity:1}
    100%{transform:translate(0,0);opacity:.8}
  }
  .plane{position:absolute;top:0;left:0;font-size:clamp(42px,5.8vw,62px);
    transform:rotate(135deg);
    /* placeholder */
    animation:fly 5.5s ease-in-out infinite;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.18));z-index:6;
  }
  .plane .label{font-size:11px;font-weight:800;color:#a0432a;background:#fff;
    padding:2px 7px;border-radius:6px;position:absolute;bottom:-26px;right:-4px;white-space:nowrap;transform:rotate(-135deg);transform-origin:center;
    box-shadow:0 2px 5px rgba(0,0,0,.12);}
  @keyframes fly{
    0%{transform:translate(0,0) rotate(135deg);opacity:.8}
    45%{transform:translate(0,20px) rotate(135deg);opacity:1}
    100%{transform:translate(0,0) rotate(135deg);opacity:.8}
  }
  
  .langsel{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;border:2px solid #ffd9c4;font-family:inherit;font-size:13px;color:#5b4636;background:#fff;cursor:pointer;z-index:20;}
  /* 轮船/飞机 可点击 */
  .ship,.plane{cursor:pointer;transition:transform .2s;}
  .ship:hover,.plane:hover{transform:scale(1.12);}

  /* 弹窗 */
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:99;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);}
  .modal.show{display:flex;}
  .modal-box{
    width:min(360px,90vw);background:#fff;border-radius:24px;padding:26px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;
    animation:pop .35s cubic-bezier(.2,.9,.3,1.4);
  }
  .modal-emoji{font-size:54px;line-height:1;margin-bottom:8px;}
  .modal-title{font-size:20px;font-weight:800;color:#5b4636;margin-bottom:4px;}
  .modal-sub{font-size:13px;color:#8a7466;margin-bottom:14px;}
  .modal textarea{
    width:100%;border:2px solid #ffe0cf;border-radius:14px;padding:12px;
    font-size:15px;font-family:inherit;color:#5b4636;resize:vertical;outline:none;
    min-height:90px;
  }
  .modal textarea:focus{border-color:#ff8b7a;}
  .modal-btns{display:flex;gap:10px;margin-top:14px;}
  .modal-btn{flex:1;padding:12px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;}
  .modal-cancel{background:#f0e8dd;color:#8a7466;}
  .modal-send{background:#ff8b7a;color:#fff;}
  .modal-send:hover{background:#e8503a;}
  .modal-thanks{display:none;}


  /* ===== 移动端适配（竖屏手机） ===== */
  @media (max-width: 768px){
    .stage{
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:10px;
      padding:70px 12px 12px; /* 顶部留白给语言选择器 */
      width:100%;height:100%;
      position:relative;
      overflow:hidden;
    }
    /* 语言选择器固定顶部 */
    .langsel{top:10px;font-size:14px;padding:8px 16px;}

    /* 左侧标题：放圆圈上方，居中、缩小，不换行重叠 */
    .side-left{
      order:-1;
      width:100%;
      max-width:none;
      text-align:center;
      margin-bottom:2px;
    }
    .side-left h1{font-size:clamp(18px,5.4vw,26px);line-height:1.15;}
    .side-left .eyebrow{font-size:11px;padding:5px 14px;margin-bottom:6px;}

    /* 圆圈：缩小一点，避免动物卡片贴边被切 */
    .orbit{
      width:min(300px,68vmin);
      max-height:52vh;
      margin:0 auto;
    }
    .center .name{font-size:15px;}
    .center .tag{font-size:8px;padding:3px 10px;}
    .center .emoji{font-size:clamp(36px,10vw,54px);}

    /* 右侧标语：放圆圈下方，缩小、居中 */
    .side-right{
      order:2;
      width:100%;
      max-width:none;
      font-size:14px;
      text-align:center;
      margin-top:2px;
    }
    .side-right .side-sub{font-size:12px;}

    /* 动物卡片字号（稍缩小，名字更完整显示） */
    .animal{width:14%;background:rgba(255,255,255,.97);}
    .animal .emoji{font-size:clamp(18px,6.5vw,30px);}
    .animal .nm{font-size:9px;line-height:1.1;padding:0 2px;white-space:nowrap;}

    /* 运输元素（轮船/飞机）适当缩小 */
    .ship{font-size:clamp(34px,10vw,48px);}
    .plane{font-size:clamp(30px,9vw,44px);}
    .ship .label{font-size:9px;bottom:-22px;}
    .plane .label{font-size:9px;bottom:-22px;}

    footer{font-size:11px;bottom:8px;}
  }

</style>
</head>

<script>
  const animals=[
    {e:'🦅',n:'美国'},{e:'🐂',n:'瑞士'},{e:'🐓',n:'法国'},{e:'🐻',n:'德国'},
    {e:'🦁',n:'英国'},{e:'🦘',n:'澳大利亚'},{e:'🐯',n:'韩国'},{e:'🌸',n:'俄罗斯'},
    {e:'🐨',n:'新西兰'},{e:'🐻‍❄️',n:'日本'},{e:'🐆',n:'卡塔尔'},{e:'🐪',n:'阿联酋 · 迪拜'},{e:'🐫',n:'沙特阿拉伯'}
  ];
  const orbit=document.getElementById('orbit');
  const r=40,count=animals.length;
  const shipEl=document.querySelector('.ship');
  const planeEl=document.querySelector('.plane');
  animals.forEach((a,i)=>{
    const angle=(360/count)*i-90;
    const x=50+r*Math.cos(angle*Math.PI/180);
    const y=50+r*Math.sin(angle*Math.PI/180);
    const div=document.createElement('div');
    div.className='animal';
    div.style.left=x+'%';div.style.top=y+'%';
    div.style.transform='translate(-50%,-50%)';
    div.style.animationDelay=(0.08+i*0.05)+'s';
    div.setAttribute('data-name',a.n);
    div.setAttribute('data-index', i);
    div.innerHTML=`<span class="emoji">${a.e}</span><div class="nm">${a.n}</div>`;
    orbit.appendChild(div);
  });

  // === 动态跟随：让轮船船头对准卡塔尔圈边缘、飞机机尾对准美国圈边缘 ===
  function positionTransports(){
    // 用与动物完全相同的数学角度放置(美国=index0,卡塔尔=index10)，不依赖DOM查找，避免翻译/重建导致找不到
    function pt(i){ const a=(360/count)*i-90; return {x:50+r*Math.cos(a*Math.PI/180), y:50+r*Math.sin(a*Math.PI/180)}; }
    const us=pt(0);   // 美国
    const qa=pt(10);  // 卡塔尔
    const cn={x:50,y:50}; // 中国=orbit中心
    function place(el,xp,yp,rot){
      const pw=el.offsetWidth||el.getBoundingClientRect().width;
      const ph=el.offsetHeight||el.getBoundingClientRect().height;
      el.style.left=(xp/100*orbit.clientWidth - pw/2)+'px';
      el.style.top =(yp/100*orbit.clientHeight - ph/2)+'px';
      el.style.transform='rotate('+rot+'deg)';
    }
    // 飞机：放美国↔中国 连线中点，机头朝中国（机尾朝美国）
    const pAng=Math.atan2(cn.y-us.y, cn.x-us.x)*180/Math.PI - 45; // ✈️默认朝右上，减45°
    place(planeEl, (us.x+cn.x)/2, (us.y+cn.y)/2, pAng); // 飞机在美国↔中国连线中间, 机头朝中国/尾朝美国
    // 轮船：放中国↔卡塔尔 连线中点，船头朝卡塔尔（船尾朝中国）
    const sAng=Math.atan2(qa.y-cn.y, qa.x-cn.x)*180/Math.PI - 180; // 🚢默认朝左，补偿
    place(shipEl, (cn.x+qa.x)/2, (cn.y+qa.y)/2, sAng);
    // 提示文字放在美国(USA)头像上方
    const hintEl=document.getElementById('hint'); if(hintEl){ hintEl.style.left=(us.x/100*orbit.clientWidth - hintEl.offsetWidth/2)+'px'; hintEl.style.top=((us.y-10)/100*orbit.clientHeight)+'px'; }
    requestAnimationFrame(positionTransports);
  }
  requestAnimationFrame(positionTransports);

  // 轮船/飞机 点击 -> 弹窗询盘
  const modal=document.getElementById('tradeModal');
  const mEmoji=document.getElementById('mEmoji');
  const mTitle=document.getElementById('mTitle');
  const mSub=document.getElementById('mSub');
  const mText=document.getElementById('mText');
  const mForm=document.getElementById('mForm');
  const mThanks=document.getElementById('mThanks');
  const mThanksText=document.getElementById('mThanksText');
  let mode='';
  function openModal(kind){
    mode=kind;
    const m=I18N[lang].modal[kind];
    mEmoji.textContent = kind==='ship' ? '🚢' : '✈️';
    mTitle.textContent = m.t;
    mSub.textContent = m.s;
    mText.placeholder = m.ph;
    mForm.style.display='block'; mThanks.style.display='none'; mText.value='';
    modal.classList.add('show');
  }
  document.querySelector('.ship').addEventListener('click',()=>openModal('ship'));
  document.querySelector('.plane').addEventListener('click',()=>openModal('plane'));
  document.getElementById('mCancel').addEventListener('click',()=>modal.classList.remove('show'));
  document.getElementById('mClose').addEventListener('click',()=>modal.classList.remove('show'));
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('show'); });
  // 询盘提交 -> 存储到 Supabase messages 表（作者 App 可接收）
  const SUPABASE_URL='https://elrsrrvvuhfbkmxnvtod.supabase.co';
  const SUPABASE_ANON='sb_publishable_XuZtEeFeJK6GtQC1RE3O6A_ZoVMcaO6';
  async function postLead(rec){
    try{
      const resp=await fetch(SUPABASE_URL+'/rest/v1/messages',{
        method:'POST',
        headers:{
          'apikey':SUPABASE_ANON,
          'Authorization':'Bearer '+SUPABASE_ANON,
          'Content-Type':'application/json',
          'Prefer':'return=minimal'
        },
        body:JSON.stringify({
          device_id:'website:'+rec.mode,

  function orbitskin(countries){
    const orbit=document.getElementById('orbit');
    // 移除旧动物卡(保留 center/ship/plane)
    document.querySelectorAll('.animal').forEach(e=>e.remove());
    const r=40,count=ANIMALS.length;
    ANIMALS.forEach((a,i)=>{
      const angle=(360/count)*i-90;
      const x=50+r*Math.cos(angle*Math.PI/180);
      const y=50+r*Math.sin(angle*Math.PI/180);
      const div=document.createElement('div');
      div.className='animal';
      div.style.left=x+'%';div.style.top=y+'%';
      div.style.transform='translate(-50%,-50%)';
      div.style.animationDelay=(0.08+i*0.05)+'s';
      div.setAttribute('data-name',countries[i]);
      div.innerHTML=`<span class="emoji">${a.e}</span><div class="nm">${countries[i]}</div>`;

    });
    positionTransports();
  }
